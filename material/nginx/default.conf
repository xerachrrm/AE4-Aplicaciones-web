# Servidor Web de la aplicación DPL (curso DPL, UT4)
# Sirve el build de Vite (frontend/dist) y hace de proxy inverso hacia el
# servidor de aplicaciones Django (servicio "django" de la red de Compose).
# El puerto interno 8000 de Django NO se publica al anfitrión: esta es la
# única puerta de entrada (patrón de producción, ver teoria/despliegue.md).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Contenido estático (build de Vite). try_files da soporte al enrutado
    # de las SPAs: cualquier ruta que no exista cae en index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API del servidor de aplicaciones: se reenvía al servicio "django"
    # por la red interna de Compose (proxy inverso).
    location /api/ {
        proxy_pass http://django:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Endpoint de salud, también atendido por Django.
    location = /healthz {
        proxy_pass http://django:8000/healthz;
        proxy_set_header Host $host;
    }
}